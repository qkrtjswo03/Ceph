apiVersion: v1
kind: Secret
metadata:
  name: csi-fs-secret
  namespace: default # 문서상 default 네임스페이스에 생성
stringData:
  userID: cephfs # 단계 3에서 생성한 사용자 ID
  userKey: CHANGE_ME_CEPHFS_USER_KEY # client.cephfs의 key 값으로 대체
  adminID: admin # 일반적으로 Ceph 관리자 ID
  adminKey: CHANGE_ME_CEPH_ADMIN_KEY # client.admin의 key 값으로 대체

